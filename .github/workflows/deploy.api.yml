name: deploy-api

on:
  push:
    branches: [main]
    paths:
      - "JobTracker.Api/**"
      - "global.json"

jobs:
  build-test-deploy:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.4x"

      - name: Verify .NET SDK
        run: |
          dotnet --version
          dotnet --info

      - name: Restore
        run: dotnet restore JobTracker.Api/JobTracker.Api.csproj

      - name: Build
        run: dotnet build JobTracker.Api/JobTracker.Api.csproj --no-restore -c Release

      - name: Test
        run: dotnet test JobTracker.Api.Tests/JobTracker.Api.Tests.csproj -c Release

      - name: Publish via Web Deploy
        run: >
          dotnet publish JobTracker.Api/JobTracker.Api.csproj
          -c Release
          /p:PublishProfile=JobTracker.Api/Properties/PublishProfiles/site90996-WebDeploy.pubxml
          /p:Username="${{ secrets.MONSTERASP_USERNAME }}"
          /p:Password="${{ secrets.MONSTERASP_PASSWORD }}"
          /p:AllowUntrustedCertificate=true
