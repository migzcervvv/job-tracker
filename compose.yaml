name: jobtracker-local
services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16
    environment:
      POSTGRES_DB: jobtracker_test
      POSTGRES_USER: jobtracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtracker -d jobtracker_test"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: {context: ., dockerfile: JobTracker.Api/Dockerfile, target: migrate}
    environment:
      ConnectionStrings__Default: Host=postgres;Database=jobtracker_test;Username=jobtracker;Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build: {context: ., dockerfile: JobTracker.Api/Dockerfile, target: final}
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Database=jobtracker_test;Username=jobtracker;Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY}
      Jwt__Issuer: jobtracker-local
      Automation__ApiKey: ${AUTOMATION_KEY:?Set AUTOMATION_KEY}
      Automation__WorkerEnabled: "true"
      Bootstrap__AdminEmail: ${BOOTSTRAP_EMAIL}
      Bootstrap__AdminPassword: ${BOOTSTRAP_PASSWORD}
      TestAccount__Email: ${DEMO_EMAIL:-}
      TestAccount__Password: ${DEMO_PASSWORD:-}
      Supabase__Url: ${SUPABASE_URL:-}
      Supabase__ServiceRoleKey: ${SUPABASE_SERVICE_KEY:-}
      Cors__Origins__0: http://localhost:5173
      Cors__Origins__1: http://127.0.0.1:5173
      N8n__BaseUrl: http://fixture:5678
      N8n__SkillExtractionWebhookUrl: http://fixture:5678/webhook/skills
      N8n__InterviewQuestionsWebhookUrl: http://fixture:5678/webhook/questions
      N8n__ResumeExtractionWebhookUrl: http://fixture:5678/webhook/resumes
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      fixture: {condition: service_started}
  fixture:
    image: node:24-alpine
    working_dir: /workspace
    command: ["node", "scripts/automation-fixture.mjs"]
    environment:
      AUTOMATION_KEY: ${AUTOMATION_KEY}
      API_BASE_URL: http://api:8080
      PORT: "5678"
    volumes: ["./scripts:/workspace/scripts:ro", "./n8n:/workspace/n8n:ro"]
  n8n:
    profiles: ["n8n"]
    image: ${N8N_IMAGE:?Set a versioned N8N_IMAGE}
    ports: ["127.0.0.1:5678:5678"]
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY}
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: UTC
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "24"
    volumes: ["n8n-data:/home/node/.n8n"]
  parser:
    profiles: ["n8n"]
    build: {context: ., dockerfile: parser/Dockerfile}
    environment:
      PARSER_API_KEY: ${PARSER_API_KEY:?Set PARSER_API_KEY}
      RESUME_DOWNLOAD_HOST: ${SUPABASE_DOWNLOAD_HOST:?Set SUPABASE_DOWNLOAD_HOST}
volumes:
  postgres-data:
  n8n-data:
