name: verify
on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
    outputs:
      tested-sha:
        value: ${{ jobs.api.outputs.sha }}
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    env:
      JOBTRACKER_TEST_DATABASE: Host=localhost;Port=5432;Database=jobtracker_test;Username=jobtracker;Password=integration-only-password
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install native PostgreSQL and pgvector
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-16 postgresql-server-dev-16 build-essential
          git clone --depth 1 --branch v0.8.2 https://github.com/pgvector/pgvector.git "$RUNNER_TEMP/pgvector"
          # Build the native extension without optional LLVM bitcode; runner images
          # may lack the exact clang version referenced by PostgreSQL's PGXS config.
          make -C "$RUNNER_TEMP/pgvector" PG_CONFIG=/usr/lib/postgresql/16/bin/pg_config with_llvm=no
          sudo make -C "$RUNNER_TEMP/pgvector" PG_CONFIG=/usr/lib/postgresql/16/bin/pg_config with_llvm=no install
          sudo systemctl start postgresql
          sudo -u postgres psql --set ON_ERROR_STOP=1 --command "CREATE ROLE jobtracker LOGIN SUPERUSER PASSWORD 'integration-only-password';"
          sudo -u postgres createdb --owner=jobtracker jobtracker_test
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - run: dotnet restore JobTracker.Api.Tests/JobTracker.Api.Tests.csproj
      - run: dotnet test JobTracker.Api.Tests/JobTracker.Api.Tests.csproj -c Release --no-restore --logger trx --results-directory artifacts/tests --collect:"XPlat Code Coverage"
      - name: Reject skipped tests in CI
        shell: pwsh
        run: |
          $files = @(Get-ChildItem artifacts/tests -Filter *.trx)
          if ($files.Count -eq 0) { throw "No test results were produced" }
          foreach ($file in $files) {
            [xml]$result = Get-Content $file.FullName
            if ([int]$result.TestRun.ResultSummary.Counters.notExecuted -gt 0) { throw "CI tests were skipped" }
          }
      - name: Verify PostgreSQL backup and restore with vectors
        env:
          PGHOST: localhost
          PGUSER: jobtracker
          PGPASSWORD: integration-only-password
        run: |
          psql -d jobtracker_test --set ON_ERROR_STOP=1 --command "CREATE TABLE restore_probe (id integer PRIMARY KEY, embedding vector(3)); INSERT INTO restore_probe VALUES (1, '[1,2,3]');"
          pg_dump -d jobtracker_test --format=custom --file="$RUNNER_TEMP/backup.dump"
          createdb jobtracker_restore_test
          pg_restore -d jobtracker_restore_test --no-owner --exit-on-error "$RUNNER_TEMP/backup.dump"
          test "$(psql -d jobtracker_restore_test -Atc 'SELECT count(*) FROM restore_probe')" = "1"
          test "$(psql -d jobtracker_restore_test -Atc 'SELECT embedding::text FROM restore_probe WHERE id = 1')" = "[1,2,3]"
          dropdb jobtracker_restore_test
      - run: dotnet tool restore
        working-directory: JobTracker.Api
      - run: dotnet ef migrations has-pending-model-changes --context AppDbContext
        working-directory: JobTracker.Api
      - run: dotnet ef migrations script --idempotent --context AppDbContext --output ../artifacts/migrations.sql
        working-directory: JobTracker.Api
      - run: dotnet publish JobTracker.Api/JobTracker.Api.csproj -c Release --no-restore -o artifacts/api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-${{ steps.revision.outputs.sha }}
          path: artifacts/
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: node --test scripts/contracts.test.mjs
        working-directory: .
      - uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: client/dist/
  parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: parser/requirements.txt
      - name: Install document parsing dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes antiword
          python -m pip install -r parser/requirements.txt
      - run: python -m unittest discover -s parser -v
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Scan the current checkout for secrets
        run: |
          curl --fail --location --output /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks dir . --redact --no-banner --config .gitleaks.toml
