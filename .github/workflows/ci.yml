name: verify
on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
    outputs:
      tested-sha:
        value: ${{ jobs.api.outputs.sha }}
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16
        env:
          POSTGRES_DB: jobtracker_test
          POSTGRES_USER: jobtracker
          POSTGRES_PASSWORD: integration-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobtracker -d jobtracker_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      JOBTRACKER_TEST_DATABASE: Host=localhost;Port=5432;Database=jobtracker_test;Username=jobtracker;Password=integration-only-password
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore JobTracker.Api.Tests/JobTracker.Api.Tests.csproj
      - run: dotnet test JobTracker.Api.Tests/JobTracker.Api.Tests.csproj -c Release --no-restore --logger trx --results-directory artifacts/tests --collect:"XPlat Code Coverage"
      - name: Reject skipped tests in CI
        shell: pwsh
        run: |
          $files = Get-ChildItem artifacts/tests -Filter *.trx
          foreach ($file in $files) {
            [xml]$result = Get-Content $file.FullName
            if ([int]$result.TestRun.ResultSummary.Counters.notExecuted -gt 0) { throw "CI tests were skipped" }
          }
      - name: Verify a PostgreSQL backup can be restored with vectors
        env:
          TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$TEST_CONTAINER" psql -U jobtracker -d jobtracker_test -c "CREATE TABLE restore_probe (id integer PRIMARY KEY, embedding vector(3)); INSERT INTO restore_probe VALUES (1, '[1,2,3]');"
          docker exec "$TEST_CONTAINER" pg_dump -U jobtracker -d jobtracker_test -Fc -f /tmp/backup.dump
          docker exec "$TEST_CONTAINER" createdb -U jobtracker jobtracker_restore_test
          docker exec "$TEST_CONTAINER" pg_restore -U jobtracker -d jobtracker_restore_test --no-owner --exit-on-error /tmp/backup.dump
          test "$(docker exec "$TEST_CONTAINER" psql -U jobtracker -d jobtracker_restore_test -Atc 'SELECT count(*) FROM restore_probe')" = "1"
          docker exec "$TEST_CONTAINER" dropdb -U jobtracker jobtracker_restore_test
      - run: dotnet tool restore
        working-directory: JobTracker.Api
      - run: dotnet ef migrations has-pending-model-changes --context AppDbContext
        working-directory: JobTracker.Api
      - run: dotnet ef migrations script --idempotent --context AppDbContext --output ../artifacts/migrations.sql
        working-directory: JobTracker.Api
      - run: dotnet publish JobTracker.Api/JobTracker.Api.csproj -c Release --no-restore -o artifacts/api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-${{ steps.revision.outputs.sha }}
          path: artifacts/
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: node --test scripts/contracts.test.mjs
        working-directory: .
      - uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: client/dist/
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Build Linux API and migration images
        run: |
          docker build -f JobTracker.Api/Dockerfile --target final -t jobtracker-api:ci .
          docker build -f JobTracker.Api/Dockerfile --target migrate -t jobtracker-migrate:ci .
          docker build -f parser/Dockerfile -t jobtracker-parser:ci .
      - name: Parser regression tests
        run: docker run --rm -v "$PWD/parser:/tests:ro" --entrypoint python jobtracker-parser:ci -m unittest discover -s /tests -v
      - name: Validate local compose configuration
        env:
          POSTGRES_PASSWORD: ci-password
          JWT_KEY: ci-key-at-least-32-bytes-long-for-test-only
          AUTOMATION_KEY: ci-automation-test-key
          N8N_ENCRYPTION_KEY: ci-encryption-test-key
          N8N_IMAGE: docker.n8n.io/n8nio/n8n:2.42.3
          PARSER_API_KEY: ci-parser-key
          SUPABASE_DOWNLOAD_HOST: fixture.supabase.co
        run: docker compose config --quiet
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Scan the current checkout for secrets
        run: |
          curl --fail --location --output /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks dir . --redact --no-banner --config .gitleaks.toml
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"
      - run: terraform fmt -check
        working-directory: infra
      - run: terraform init -backend=false
        working-directory: infra
      - run: terraform validate
        working-directory: infra
